# XcodeGen spec. Run `xcodegen generate` to create KKit.xcodeproj (git-ignored).
# Edit this file, never the generated project.
name: KKit

options:
  bundleIdPrefix: com.kv
  deploymentTarget:
    macOS: "14.2"
  createIntermediateGroups: true

configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  KKitModules:
    path: Packages/KKitModules

targets:
  KKit:
    type: application
    platform: macOS
    sources:
      - path: App
    settings:
      base:
        PRODUCT_NAME: KKit
        PRODUCT_BUNDLE_IDENTIFIER: com.kv.kkit
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: App/KKit.entitlements
        CODE_SIGN_STYLE: Automatic
        # Both come from Config/Signing.xcconfig, overridable in the git-ignored
        # Config/Local.xcconfig (see Config/Local.xcconfig.example).
        CODE_SIGN_IDENTITY: $(KKIT_CODE_SIGN_IDENTITY)
        DEVELOPMENT_TEAM: $(KKIT_DEVELOPMENT_TEAM)
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: KKitModules
        product: KKitCore
      - package: KKitModules
        product: KKitUI
      - package: KKitModules
        product: KKitServicesAPI
      - package: KKitModules
        product: KKitServices
      - package: KKitModules
        product: KKitHosts
      # Features: one entry per feature target (ARCHITECTURE.md §11).
      - package: KKitModules
        product: FeaturePower
      - package: KKitModules
        product: FeatureStats
      - package: KKitModules
        product: FeatureNightShift
      - package: KKitModules
        product: FeatureVolume
      - package: KKitModules
        product: FeaturePrivacyIndicator
      - package: KKitModules
        product: FeatureTimer
      - package: KKitModules
        product: FeatureToggles
      - package: KKitModules
        product: FeatureSearch
      - package: KKitModules
        product: FeatureCalculator
      - package: KKitModules
        product: FeatureQuickNote
      - package: KKitModules
        product: FeatureClipboard
      - package: KKitModules
        product: FeatureScreenTools
      - package: KKitModules
        product: FeatureShelf
      - package: KKitModules
        product: FeatureKeyboard
      - package: KKitModules
        product: FeatureWindows
      - package: KKitModules
        product: FeatureCleanMode
      - package: KKitModules
        product: FeatureBrightness
      - package: KKitModules
        product: FeatureWindowSwitcher
      - package: KKitModules
        product: FeatureNowPlaying
      # Loaded by /usr/bin/perl, never by KKit, so it's embedded but not linked.
      - target: KKitMediaRemoteAdapter
        embed: true
        link: false
    scheme: {}

  # Now Playing helper (Helpers/MediaRemoteAdapter): a small library that
  # MediaRemoteNowPlayingService loads into /usr/bin/perl, because MediaRemote only
  # answers Apple's own processes since macOS 15.4.
  KKitMediaRemoteAdapter:
    type: framework
    platform: macOS
    sources:
      - path: Helpers/MediaRemoteAdapter
    settings:
      base:
        PRODUCT_NAME: KKitMediaRemoteAdapter
        PRODUCT_BUNDLE_IDENTIFIER: com.kv.kkit.mediaremote-adapter
        GENERATE_INFOPLIST_FILE: YES
        CLANG_ENABLE_OBJC_ARC: YES
        DEFINES_MODULE: NO
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: $(KKIT_CODE_SIGN_IDENTITY)
        DEVELOPMENT_TEAM: $(KKIT_DEVELOPMENT_TEAM)
